<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greenside.info — Admin</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaffed;background:#071c14}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#174b2b,#071c14 55%);min-height:100vh}header{border-bottom:1px solid #ffffff24;padding:20px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.brand b{color:#55e86a}main{max-width:1050px;margin:35px auto;padding:0 20px}h1{font-size:34px;margin-bottom:6px}p,small{color:#a6c5b0}a{color:#76f58a}.panel{background:#10271d;border:1px solid #335541;border-radius:18px;padding:24px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:flex;flex-direction:column;gap:6px}label{font-size:13px;color:#bad3c2}input,select{width:100%;background:#071b13;color:#f5fff6;border:1px solid #41624d;border-radius:9px;padding:12px;font:inherit}button{background:#53e765;color:#06230d;border:0;border-radius:9px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#294537;color:#e6ffeb}button.danger{background:#71312f;color:white}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.message{min-height:24px;color:#a8fbb5;margin-top:12px;white-space:pre-wrap}.error{color:#ffb2b2}.list{display:grid;gap:10px}.offer{border:1px solid #355b43;border-radius:11px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.offer small{display:block;margin-top:5px}.offer .actions{margin:0}#login{max-width:500px}@media(max-width:650px){.grid{grid-template-columns:1fr}.offer{align-items:flex-start;flex-direction:column}} </style></head><body>
<header><div class="brand">GREEN<b>SIDE</b><small>.info / Admin</small></div><a href="index.html">View website</a></header><main><h1>Promotion manager</h1><p>Securely publish, update, or expire promotions.</p>
<section id="login" class="panel"><h2>Admin sign in</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><br><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button id="signIn">Sign in</button></div><div id="loginMsg" class="message" role="status"></div></section>
<section id="dashboard" class="hidden"><div class="actions"><button id="newBtn">+ New promotion</button><button class="secondary" id="reload">Refresh</button><button class="secondary" id="signOut">Sign out</button></div><div id="editor" class="panel hidden"><h2 id="formTitle">New promotion</h2><form id="promoForm"><div class="grid"><div class="field"><label for="platform">Platform</label><select id="platform" required></select></div><div class="field"><label for="title">Promotion name</label><input id="title" maxlength="180" required></div><div class="field"><label for="normal">Original line (optional)</label><input id="normal" type="number" step="any" placeholder="e.g. 30.5"></div><div class="field"><label for="discount">Boosted / discounted line (optional)</label><input id="discount" type="number" step="any" placeholder="e.g. 25.5"></div><div class="field"><label for="boost">Discount percent (optional)</label><input id="boost" type="number" step="any" placeholder="e.g. 25"></div><div class="field"><label for="status">Status</label><select id="status"><option value="active">Active (public)</option><option value="expired">Expired (hidden)</option></select></div></div><div class="actions"><button type="submit" id="save">Save promotion</button><button type="button" class="secondary" id="cancel">Cancel</button></div></form></div><div id="message" class="message" role="status"></div><section class="panel"><h2>All promotions</h2><div id="offers" class="list"></div></section></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id), names=['Underdog','Betr','DraftKings Pick6','PrizePicks','Sleeper','DraftKings DFS','Splash','Chalkboard','Dabble','Boom Fantasy','ParlayPlay'];
for(const n of names){const o=document.createElement('option');o.value=n;o.textContent=n;$('platform').append(o)}
const cfg=window.GS_CONFIG||{},client=cfg.url&&cfg.key?supabase.createClient(cfg.url,cfg.key):null;let offers=[],editing=null;
const msg=(id,t,bad=false)=>{const e=$(id);e.textContent=t;e.classList.toggle('error',bad)};
const value=id=>$(id).value.trim(),num=id=>value(id)===''?null:Number(value(id));
function showEditor(item=null){editing=item?.id||null;$('formTitle').textContent=item?'Edit promotion':'New promotion';$('promoForm').reset();if(item){$('platform').value=item.platform;$('title').value=item.title;$('normal').value=item.original_line??'';$('discount').value=item.boosted_line??'';$('boost').value=item.discount_percent??'';$('status').value=item.status}$('editor').classList.remove('hidden');$('title').focus()}
function draw(){const list=$('offers');list.replaceChildren();if(!offers.length){list.textContent='No promotions yet. Add your first promotion.';return}for(const item of offers){const row=document.createElement('div');row.className='offer';const info=document.createElement('div');const heading=document.createElement('strong');heading.textContent=item.platform+' — '+item.title;const meta=document.createElement('small');meta.textContent=[item.status,item.original_line==null?'':'Normal: '+item.original_line,item.boosted_line==null?'':'Discount: '+item.boosted_line,item.discount_percent==null?'':'Discount: '+item.discount_percent+'%'].filter(Boolean).join(' · ');info.append(heading,meta);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>showEditor(item);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Permanently delete this promotion?'))return;const {error}=await client.from('promotions').delete().eq('id',item.id);if(error)msg('message',error.message,true);else await load()};actions.append(edit,del);row.append(info,actions);list.append(row)}}
async function load(){const {data,error}=await client.from('promotions').select('*').order('created_at',{ascending:false});if(error){msg('message',error.message,true);return}offers=data||[];draw();msg('message',offers.length+' promotions loaded.')}
async function check(){if(!client){msg('loginMsg','First configure Supabase in config.js.',true);return}const {data:{session}}=await client.auth.getSession();if(!session){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}if(session.user.id!=='4bd7126b-bb0c-44f4-b736-4041188e1fc5'){await client.auth.signOut();msg('loginMsg','This account is not authorized as an admin.',true);return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}
$('signIn').onclick=async()=>{if(!client)return msg('loginMsg','Configure config.js first.',true);msg('loginMsg','Signing in…');const {error}=await client.auth.signInWithPassword({email:value('email'),password:$('password').value});if(error)return msg('loginMsg',error.message,true);$('password').value='';await check()};
$('signOut').onclick=async()=>{await client.auth.signOut();await check()};$('newBtn').onclick=()=>showEditor();$('cancel').onclick=()=>$('editor').classList.add('hidden');$('reload').onclick=load;
$('promoForm').onsubmit=async e=>{e.preventDefault();const payload={platform:value('platform'),title:value('title'),original_line:num('normal'),boosted_line:num('discount'),discount_percent:num('boost'),status:value('status')};if(!names.includes(payload.platform)||!payload.title)return;const btn=$('save');btn.disabled=true;const q=editing?client.from('promotions').update(payload).eq('id',editing):client.from('promotions').insert(payload);const {error}=await q;btn.disabled=false;if(error)return msg('message',error.message,true);$('editor').classList.add('hidden');await load();msg('message','Promotion saved successfully.')};
check();
</script></body></html>
